name: FlatGeobuf transfer repair

on:
  push:
    paths:
      - "tools/flatgeobuf-transfer-repair/**"
      - ".github/workflows/flatgeobuf-transfer-repair.yml"
  pull_request:
    paths:
      - "tools/flatgeobuf-transfer-repair/**"
      - ".github/workflows/flatgeobuf-transfer-repair.yml"

permissions:
  contents: read

jobs:
  verify-binary-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run deterministic tests
        run: python -m pytest tools/flatgeobuf-transfer-repair/tests -q
